<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Reader & Audio Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #16213e;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header h1 { font-size: 1.2rem; font-weight: 500; color: #e94560; }
        .header-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        .btn {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #1a5276;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn:hover { background: #1a5276; border-color: #e94560; }
        .btn.active { background: #e94560; border-color: #e94560; }
        .btn.danger:hover { border-color: #ff6b6b; color: #ff6b6b; }

        .page-nav { display: flex; align-items: center; gap: 8px; }
        .page-nav input {
            width: 60px; padding: 5px 8px; border: 1px solid #0f3460;
            background: #16213e; color: #e0e0e0; border-radius: 6px;
            text-align: center; font-size: 0.85rem;
        }
        .page-nav input:focus { outline: none; border-color: #e94560; }

        .zoom-controls { display: flex; align-items: center; gap: 6px; }
        .zoom-level { font-size: 0.8rem; color: #aaa; min-width: 40px; text-align: center; }

        .main-content { display: flex; flex: 1; overflow: hidden; }

        .pdf-container {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; justify-content: center; align-items: flex-start;
            background: #121220;
        }

        .pdf-pages-row {
            display: flex; gap: 15px; align-items: flex-start; justify-content: center;
        }

        .pdf-page-wrapper {
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            background: white;
        }

        .pdf-page-wrapper canvas { display: block; }

        .drop-zone {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; width: 100%; border: 3px dashed #0f3460;
            border-radius: 12px; margin: 40px; padding: 60px; text-align: center;
            transition: all 0.3s;
        }
        .drop-zone.drag-over { border-color: #e94560; background: rgba(233, 69, 96, 0.1); }
        .drop-zone svg { width: 80px; height: 80px; margin-bottom: 20px; fill: #0f3460; }
        .drop-zone.drag-over svg { fill: #e94560; }
        .drop-zone h2 { font-size: 1.3rem; margin-bottom: 10px; color: #e0e0e0; }
        .drop-zone p { color: #888; font-size: 0.9rem; margin-bottom: 6px; }

        .recent-list {
            margin-top: 20px; text-align: left; max-width: 420px; width: 100%;
        }
        .recent-list h3 { font-size: 0.85rem; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .recent-item {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
            padding: 8px 12px; margin-bottom: 6px; cursor: pointer; font-size: 0.8rem;
            transition: all 0.2s;
        }
        .recent-item:hover { border-color: #e94560; }
        .recent-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .recent-item .del { background: none; border: none; color: #888; cursor: pointer; font-size: 0.9rem; padding: 2px 6px; border-radius: 4px; }
        .recent-item .del:hover { color: #ff6b6b; background: rgba(255,107,107,0.1); }

        .audio-panel {
            width: 280px; min-width: 280px; background: #16213e;
            border-left: 1px solid #0f3460; display: flex; flex-direction: column;
            transition: width 0.3s, min-width 0.3s;
        }
        .audio-panel.collapsed { width: 50px; min-width: 50px; }
        .audio-panel.collapsed .audio-body, .audio-panel.collapsed .audio-header h3 { display: none; }

        .audio-header {
            padding: 12px 15px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid #0f3460;
        }
        .audio-header h3 { font-size: 0.9rem; font-weight: 500; color: #e94560; }
        .toggle-audio { background: none; border: none; color: #e0e0e0; cursor: pointer; padding: 4px; }

        .audio-body { flex: 1; overflow-y: auto; padding: 10px; }

        .audio-file-list { display: flex; flex-direction: column; gap: 8px; }

        .audio-file-item {
            background: #1a1a2e; border: 1px solid #0f3460; border-radius: 8px;
            padding: 10px; transition: all 0.2s;
        }
        .audio-file-item.active { border-color: #e94560; background: rgba(233, 69, 96, 0.1); }

        .audio-filename { font-size: 0.8rem; color: #e0e0e0; margin-bottom: 8px; word-break: break-all; }

        .audio-controls { display: flex; align-items: center; gap: 8px; }

        .play-btn {
            width: 36px; height: 36px; border-radius: 50%; background: #e94560;
            border: none; color: white; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: transform 0.2s;
            flex-shrink: 0;
        }
        .play-btn:hover { transform: scale(1.1); }

        .audio-progress-container {
            flex: 1; height: 6px; background: #0f3460; border-radius: 3px;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .audio-progress-bar { height: 100%; background: #e94560; border-radius: 3px; width: 0%; }

        .audio-time { font-size: 0.7rem; color: #888; min-width: 35px; text-align: right; }

        .volume-control {
            display: flex; align-items: center; gap: 6px; margin-top: 10px;
            padding-top: 10px; border-top: 1px solid #0f3460;
        }
        .volume-slider {
            -webkit-appearance: none; appearance: none; width: 80px; height: 4px;
            background: #0f3460; border-radius: 2px; outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
            background: #e94560; border-radius: 50%; cursor: pointer;
        }

        .audio-drop-zone {
            border: 2px dashed #0f3460; border-radius: 8px; padding: 15px;
            text-align: center; margin-bottom: 10px; transition: all 0.3s;
            cursor: pointer;
        }
        .audio-drop-zone.drag-over { border-color: #e94560; background: rgba(233, 69, 96, 0.05); }
        .audio-drop-zone p { font-size: 0.75rem; color: #888; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #16213e; }
        ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e94560; }

        .loading { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; }
        .loading.show { display: block; }
        .spinner { width: 50px; height: 50px; border: 4px solid #0f3460; border-top-color: #e94560; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .file-input { display: none; }

        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
            background: #e94560; color: white; padding: 10px 20px; border-radius: 8px;
            font-size: 0.85rem; z-index: 2000; transition: transform 0.3s; pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="loading" id="loading"><div class="spinner"></div></div>
    <div class="toast" id="toast"></div>
    <input type="file" id="pdfInput" class="file-input" accept="application/pdf,.pdf">
    <input type="file" id="audioInput" class="file-input" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" multiple>

    <div class="header">
        <h1>📖 PDF Reader & Audio Player</h1>
        <div class="header-controls">
            <button class="btn" id="dropPdfBtn" title="Open a PDF file">📄 Open PDF</button>
            <button class="btn danger" id="closePdfBtn" style="display:none;">✖ Close PDF</button>
            <div class="page-nav">
                <button class="btn" id="prevPage">◀</button>
                <input type="number" id="pageNumber" min="1" value="1">
                <span style="color:#888; font-size:0.85rem;">/ <span id="totalPages">-</span></span>
                <button class="btn" id="nextPage">▶</button>
            </div>
            <div class="zoom-controls">
                <button class="btn" id="zoomOut">−</button>
                <span class="zoom-level" id="zoomLevel">100%</span>
                <button class="btn" id="zoomIn">+</button>
            </div>
            <button class="btn" id="viewMode">2 Pages</button>
        </div>
    </div>

    <div class="main-content">
        <div class="pdf-container" id="pdfContainer">
            <div class="drop-zone" id="pdfDropZone">
                <svg viewBox="0 0 24 24"><path d="M14,2H6A2,2,0,0,0,4,4V20a2,2,0,0,0,2,2H18a2,2,0,0,0,2-2V8Zm5,18V12H17V8H13V4H9V8H6V20H18ZM13,10v4h3V10Z"/></svg>
                <h2>Drop a PDF file here</h2>
                <p>or click "Open PDF" to browse your files</p>
                <p style="margin-top:4px;">Files are stored in your browser and stay available when you come back.</p>
                <div class="recent-list" id="recentList" style="display:none;">
                    <h3>Recent PDFs</h3>
                    <div id="recentItems"></div>
                </div>
            </div>
            <div id="pdfRender" style="display:none;"></div>
        </div>

        <div class="audio-panel" id="audioPanel">
            <div class="audio-header">
                <h3>🎵 Audio Player</h3>
                <button class="toggle-audio" id="toggleAudio" title="Toggle panel">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41,7.41L14,6L6,14l8,8L22,8l-6.59-6.59Z"/></svg>
                </button>
            </div>
            <div class="audio-body">
                <div class="audio-drop-zone" id="audioDropZone">
                    <p>📁 Drop audio files here<br>or click to browse</p>
                </div>
                <div class="audio-file-list" id="audioFileList"></div>
                <div class="volume-control">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="#888"><path d="M3,9V15H7L12,20V4L7,9H3ZM16.5,12C16.5,10.23,15.5,8.71,14,7.97V16.02C15.5,15.29,16.5,13.76,16.5,12Z"/></svg>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- PDF.js setup ----------
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ---------- State ----------
        let pdfDoc = null;          // pdf.js document
        let pdfBytes = null;        // raw ArrayBuffer of the current PDF (for re-render)
        let currentPdfName = '';
        let currentPage = 1;
        let totalPages = 0;
        let scale = 1.5;
        let twoPageMode = false;
        let audioFiles = [];        // { name, id }
        let audioUrls = {};         // id -> object URL
        let currentAudioIndex = -1;
        let audioElements = [];
        let isPlaying = false;

        // ---------- DOM ----------
        const pdfContainer   = document.getElementById('pdfContainer');
        const pdfDropZone    = document.getElementById('pdfDropZone');
        const pdfRender      = document.getElementById('pdfRender');
        const pageNumberInput= document.getElementById('pageNumber');
        const totalPagesSpan = document.getElementById('totalPages');
        const zoomLevelSpan  = document.getElementById('zoomLevel');
        const viewModeBtn    = document.getElementById('viewMode');
        const closePdfBtn    = document.getElementById('closePdfBtn');
        const recentList     = document.getElementById('recentList');
        const recentItems    = document.getElementById('recentItems');
        const audioPanel     = document.getElementById('audioPanel');
        const audioDropZone  = document.getElementById('audioDropZone');
        const audioFileList  = document.getElementById('audioFileList');
        const volumeSlider   = document.getElementById('volumeSlider');
        const loading        = document.getElementById('loading');
        const toast          = document.getElementById('toast');

        // ---------- IndexedDB (persistent file storage) ----------
        const DB_NAME = 'pdfAudioReaderDB';
        const DB_VERSION = 1;
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function dbPut(record) {
            const tx = db.transaction('files', 'readwrite');
            tx.objectStore('files').put(record);
            return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        }

        async function dbGet(id) {
            const tx = db.transaction('files', 'readonly');
            const req = tx.objectStore('files').get(id);
            return new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
        }

        async function dbGetAll() {
            const tx = db.transaction('files', 'readonly');
            const req = tx.objectStore('files').getAll();
            return new Promise((res, rej) => { req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error); });
        }

        async function dbDelete(id) {
            const tx = db.transaction('files', 'readwrite');
            tx.objectStore('files').delete(id);
            return new Promise((res, rej) => { tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        }

        function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ---------- PDF helpers ----------
        function isPdfFile(file) {
            return file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
        }

        async function loadPdfFromFile(file) {
            loading.classList.add('show');
            try {
                const buffer = await file.arrayBuffer();
                await openPdf(buffer, file.name);
                // persist
                await dbPut({ id: 'pdf-' + currentPdfName, name: file.name, type: 'pdf', data: buffer, added: Date.now() });
                renderRecentList();
            } catch (err) {
                alert('Error loading PDF: ' + err.message);
                console.error(err);
            } finally {
                loading.classList.remove('show');
            }
        }

        async function loadPdfFromStore(id, name) {
            loading.classList.add('show');
            try {
                const rec = await dbGet(id);
                if (!rec) { showToast('File not found'); return; }
                await openPdf(rec.data, rec.name || name);
            } catch (err) {
                alert('Error loading PDF: ' + err.message);
                console.error(err);
            } finally {
                loading.classList.remove('show');
            }
        }

        async function openPdf(arrayBuffer, name) {
            pdfBytes = arrayBuffer;
            currentPdfName = name;
            pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes.slice(0) }).promise; // copy so buffer stays usable
            totalPages = pdfDoc.numPages;
            totalPagesSpan.textContent = totalPages;
            pageNumberInput.max = totalPages;
            currentPage = 1;
            pageNumberInput.value = 1;

            pdfDropZone.style.display = 'none';
            pdfRender.style.display = 'block';
            closePdfBtn.style.display = 'inline-block';
            document.title = '📖 ' + name;
            renderPdf();
        }

        function closePdf() {
            pdfDoc = null; pdfBytes = null; currentPdfName = '';
            pdfRender.innerHTML = '';
            pdfRender.style.display = 'none';
            pdfDropZone.style.display = 'flex';
            closePdfBtn.style.display = 'none';
            totalPagesSpan.textContent = '-';
            pageNumberInput.value = 1;
            document.title = 'PDF Reader & Audio Player';
            renderRecentList();
        }

        async function renderPdf() {
            pdfRender.innerHTML = '';
            if (!pdfDoc) return;

            let startPage = twoPageMode
                ? (currentPage % 2 === 0 ? currentPage : currentPage - 1)
                : currentPage;
            if (startPage < 1) startPage = 1;

            const pagesToShow = twoPageMode ? Math.min(2, totalPages - startPage + 1) : 1;

            const row = document.createElement('div');
            row.className = 'pdf-pages-row';

            for (let i = 0; i < pagesToShow; i++) {
                const pageNum = startPage + i;
                if (pageNum < 1 || pageNum > totalPages) continue;
                try {
                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale });
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pdf-page-wrapper';
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({ canvasContext: ctx, viewport }).promise;
                    wrapper.appendChild(canvas);
                    row.appendChild(wrapper);
                } catch (err) {
                    console.error('Error rendering page ' + pageNum + ':', err);
                }
            }
            pdfRender.appendChild(row);
        }

        function goToPage(page) {
            if (!pdfDoc || page < 1 || page > totalPages) return;
            currentPage = page;
            pageNumberInput.value = currentPage;
            renderPdf();
            pdfContainer.scrollTop = 0;
        }

        function changeZoom(delta) {
            scale = Math.min(3, Math.max(0.5, scale + delta));
            zoomLevelSpan.textContent = Math.round(scale * 100) + '%';
            renderPdf();
        }

        // ---------- Recent PDFs list ----------
        async function renderRecentList() {
            const all = await dbGetAll();
            const pdfs = all.filter(r => r.type === 'pdf').sort((a, b) => (b.added || 0) - (a.added || 0));
            if (pdfs.length === 0) { recentList.style.display = 'none'; return; }
            recentList.style.display = 'block';
            recentItems.innerHTML = '';
            pdfs.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'recent-item';
                item.title = rec.name;
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = '📄 ' + rec.name;
                const del = document.createElement('button');
                del.className = 'del';
                del.textContent = '✖';
                del.title = 'Remove from list';
                del.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await dbDelete(rec.id);
                    renderRecentList();
                });
                item.appendChild(nameSpan);
                item.appendChild(del);
                item.addEventListener('click', () => loadPdfFromStore(rec.id, rec.name));
                recentItems.appendChild(item);
            });
        }

        // ---------- Audio helpers ----------
        function isAudioFile(file) {
            return /^audio\//i.test(file.type) || /\.(mp3|wav|ogg|m4a|flac|aac|opus|weba)$/i.test(file.name);
        }

        async function addAudioFiles(files) {
            for (const file of files) {
                if (!isAudioFile(file)) continue;
                const id = makeId();
                try {
                    const buf = await file.arrayBuffer();
                    await dbPut({ id, name: file.name, type: 'audio', data: buf, added: Date.now() });
                    audioUrls[id] = URL.createObjectURL(new Blob([buf], { type: file.type || 'audio/mpeg' }));
                    audioFiles.push({ id, name: file.name });
                } catch (err) {
                    console.error('Error storing audio file:', err);
                }
            }
            renderAudioList();
        }

        async function loadAudioListFromDB() {
            const all = await dbGetAll();
            const auds = all.filter(r => r.type === 'audio').sort((a, b) => (a.added || 0) - (b.added || 0));
            audioFiles = [];
            for (const rec of auds) {
                audioUrls[rec.id] = URL.createObjectURL(new Blob([rec.data], { type: 'audio/mpeg' }));
                audioFiles.push({ id: rec.id, name: rec.name });
            }
            renderAudioList();
        }

        async function removeAudioFile(index) {
            const f = audioFiles[index];
            if (!f) return;
            if (index === currentAudioIndex && audioElements[index]) audioElements[index].pause();
            if (audioUrls[f.id]) URL.revokeObjectURL(audioUrls[f.id]);
            delete audioUrls[f.id];
            await dbDelete(f.id);
            audioFiles.splice(index, 1);
            audioElements.splice(index, 1);
            if (currentAudioIndex === index) currentAudioIndex = -1;
            else if (currentAudioIndex > index) currentAudioIndex--;
            renderAudioList();
        }

        function renderAudioList() {
            audioFileList.innerHTML = '';
            audioFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'audio-file-item' + (index === currentAudioIndex ? ' active' : '');

                const playIcon  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8,5V19L19,12Z"/></svg>';
                const pauseIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M6,19H10V5H6ZM14,19H18V5H14Z"/></svg>';

                const nameDiv = document.createElement('div');
                nameDiv.className = 'audio-filename';
                nameDiv.textContent = '🎵 ' + file.name;

                const controls = document.createElement('div');
                controls.className = 'audio-controls';

                const playBtn = document.createElement('button');
                playBtn.className = 'play-btn';
                playBtn.dataset.index = index;
                playBtn.innerHTML = (index === currentAudioIndex && isPlaying) ? pauseIcon : playIcon;

                const progWrap = document.createElement('div');
                progWrap.className = 'audio-progress-container';
                progWrap.dataset.index = index;
                const progBar = document.createElement('div');
                progBar.className = 'audio-progress-bar';
                progBar.id = 'progress-' + index;
                progBar.style.width = '0%';
                progWrap.appendChild(progBar);

                const timeSpan = document.createElement('span');
                timeSpan.className = 'audio-time';
                timeSpan.id = 'time-' + index;
                timeSpan.textContent = '0:00';

                controls.appendChild(playBtn);
                controls.appendChild(progWrap);
                controls.appendChild(timeSpan);

                const delBtn = document.createElement('button');
                delBtn.className = 'btn danger';
                delBtn.style.cssText = 'padding:2px 8px;font-size:0.7rem;';
                delBtn.textContent = '✖';
                delBtn.title = 'Remove';
                delBtn.addEventListener('click', (e) => { e.stopPropagation(); removeAudioFile(index); });

                item.appendChild(nameDiv);
                item.appendChild(controls);
                item.appendChild(delBtn);

                playBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(index); });
                item.addEventListener('click', () => selectAudio(index));

                progWrap.addEventListener('click', (e) => {
                    if (!audioElements[index]) return;
                    const rect = progWrap.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    audioElements[index].currentTime = percent * audioElements[index].duration;
                });

                audioFileList.appendChild(item);
            });
        }

        function selectAudio(index) {
            if (currentAudioIndex >= 0 && audioElements[currentAudioIndex]) {
                audioElements[currentAudioIndex].pause();
            }
            isPlaying = false;
            currentAudioIndex = index;
            const file = audioFiles[index];
            if (!audioElements[index] && audioUrls[file.id]) {
                audioElements[index] = new Audio(audioUrls[file.id]);
                audioElements[index].volume = parseFloat(volumeSlider.value);
                audioElements[index].addEventListener('timeupdate', updateProgress);
                audioElements[index].addEventListener('ended', () => {
                    isPlaying = false;
                    renderAudioList();
                });
                audioElements[index].addEventListener('error', () => {
                    showToast('Could not play: ' + file.name);
                });
            }
            renderAudioList();
        }

        function togglePlay(index) {
            if (currentAudioIndex !== index) selectAudio(index);
            const audio = audioElements[index];
            if (!audio) return;
            if (isPlaying) { audio.pause(); isPlaying = false; }
            else {
                // pause any other playing audio
                audioElements.forEach(a => { if (a && a !== audio) a.pause(); });
                audio.play().catch(err => console.error('Play error:', err));
                isPlaying = true;
            }
            renderAudioList();
        }

        function updateProgress() {
            if (currentAudioIndex < 0 || !audioElements[currentAudioIndex]) return;
            const audio = audioElements[currentAudioIndex];
            if (!audio.duration) return;
            const progress = (audio.currentTime / audio.duration) * 100;
            const bar = document.getElementById('progress-' + currentAudioIndex);
            const time = document.getElementById('time-' + currentAudioIndex);
            if (bar) bar.style.width = progress + '%';
            if (time) {
                const mins = Math.floor(audio.currentTime / 60);
                const secs = Math.floor(audio.currentTime % 60);
                time.textContent = mins + ':' + String(secs).padStart(2, '0');
            }
        }

        // ---------- Drag & drop / file inputs ----------
        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
            pdfContainer.addEventListener(ev, preventDefaults);
            audioDropZone.addEventListener(ev, preventDefaults);
        });

        pdfContainer.addEventListener('dragenter', () => pdfDropZone.classList.add('drag-over'));
        pdfContainer.addEventListener('dragover',  () => pdfDropZone.classList.add('drag-over'));
        pdfContainer.addEventListener('dragleave', (e) => {
            if (!pdfContainer.contains(e.relatedTarget)) pdfDropZone.classList.remove('drag-over');
        });
        pdfContainer.addEventListener('drop', (e) => {
            pdfDropZone.classList.remove('drag-over');
            const file = Array.from(e.dataTransfer.files).find(isPdfFile);
            if (file) loadPdfFromFile(file);
            else showToast('Please drop a PDF file');
        });

        audioDropZone.addEventListener('dragenter', () => audioDropZone.classList.add('drag-over'));
        audioDropZone.addEventListener('dragover',  (e) => {
            audioDropZone.classList.add('drag-over');
            e.dataTransfer.dropEffect = 'copy';
        });
        audioDropZone.addEventListener('dragleave', () => audioDropZone.classList.remove('drag-over'));
        audioDropZone.addEventListener('drop', (e) => {
            audioDropZone.classList.remove('drag-over');
            const files = Array.from(e.dataTransfer.files).filter(isAudioFile);
            if (files.length) addAudioFiles(files);
        });
        audioDropZone.addEventListener('click', () => document.getElementById('audioInput').click());

        document.getElementById('dropPdfBtn').addEventListener('click', () => document.getElementById('pdfInput').click());
        closePdfBtn.addEventListener('click', closePdf);

        document.getElementById('pdfInput').addEventListener('change', (e) => {
            if (e.target.files.length && isPdfFile(e.target.files[0])) loadPdfFromFile(e.target.files[0]);
            e.target.value = '';
        });
        document.getElementById('audioInput').addEventListener('change', (e) => {
            if (e.target.files.length) addAudioFiles(Array.from(e.target.files).filter(isAudioFile));
            e.target.value = '';
        });

        // Header controls
        document.getElementById('prevPage').addEventListener('click', () => goToPage(currentPage - 1));
        document.getElementById('nextPage').addEventListener('click', () => goToPage(currentPage + 1));
        pageNumberInput.addEventListener('change', (e) => {
            const p = parseInt(e.target.value);
            if (pdfDoc && p >= 1 && p <= totalPages) goToPage(p);
            else e.target.value = currentPage;
        });
        document.getElementById('zoomIn').addEventListener('click', () => changeZoom(0.25));
        document.getElementById('zoomOut').addEventListener('click', () => changeZoom(-0.25));
        viewModeBtn.addEventListener('click', () => {
            twoPageMode = !twoPageMode;
            viewModeBtn.textContent = twoPageMode ? '1 Page' : '2 Pages';
            renderPdf();
        });
        document.getElementById('toggleAudio').addEventListener('click', () => audioPanel.classList.toggle('collapsed'));
        volumeSlider.addEventListener('input', (e) => {
            if (audioElements[currentAudioIndex]) audioElements[currentAudioIndex].volume = parseFloat(e.target.value);
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToPage(currentPage + 1);
            if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goToPage(currentPage - 1);
            if (e.key === ' ') { e.preventDefault(); if (currentAudioIndex >= 0) togglePlay(currentAudioIndex); }
        });

        // ---------- Init ----------
        (async function init() {
            try {
                db = await openDB();
                await renderRecentList();
                await loadAudioListFromDB();
            } catch (err) {
                console.error('IndexedDB unavailable, files will not persist:', err);
                showToast('Storage unavailable; files will work for this session only');
            }
        })();
    </script>
</body>
</html>
